<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ICPC NMU CF Tracker - Track your competitive programming progress">
    <title>{% block title %}ICPC NMU{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="{{ url_for('static', filename='logo.svg') }}" class="logo-icon" alt="ICPC NMU Logo">
                    <div class="logo-text-container">
                        <span class="logo-text">ICPC NMU</span>
                        <span class="logo-subtitle">CF Tracker</span>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="/groups" class="nav-item {% if request.endpoint == 'groups_page' %}active{% endif %}">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">Groups</span>
                </a>
                <a href="/spreadsheets"
                    class="nav-item {% if request.endpoint == 'spreadsheets_page' %}active{% endif %}">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">Spreadsheets</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="api-status" id="apiStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Checking API...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="content-header">
                <h1>{% block header %}Dashboard{% endblock %}</h1>
                <div class="header-actions">
                    {% block header_actions %}{% endblock %}
                </div>
            </header>

            <div class="content-body">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Modal Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Modal Title</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
